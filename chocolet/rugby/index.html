<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rugby 7s — Phase 1</title>
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title">Rugby 7s — Phase 1 prototype</div>
        <div class="controls-hint">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
          <span><kbd>LMB</kbd> hold = charge pass / release = pass</span>
          <span><kbd>F</kbd> tackle (5s cooldown)</span>
          <span><kbd>R</kbd> restart</span>
        </div>
      </header>

      <div class="hud">
        <div class="score">
          <div class="team team-a">YOU <span id="scoreA">0</span></div>
          <div class="time" id="time">1:00</div>
          <div class="team team-b"><span id="scoreB">0</span> CPU</div>
        </div>
        <div class="bar">
          <div class="bar-label">Pass power</div>
          <div class="bar-track"><div class="bar-fill" id="powerBar"></div></div>
        </div>
      </div>

      <canvas id="pitch" width="1430" height="780" aria-label="Rugby pitch"></canvas>

      <div class="msg" id="msg"></div>
    </main>

    <script type="module" src="./app.js?v=2"></script>
  </body>
</html>

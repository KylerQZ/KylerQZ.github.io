<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chocoby — multiplayer rugby</title>
    <link rel="stylesheet" href="./styles.css?v=5" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title">Chocoby <span id="connStatus" class="conn">connecting…</span></div>
        <div class="controls-hint">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
          <span><kbd>LMB</kbd> with ball = charge pass &nbsp;·&nbsp; <kbd>LMB</kbd> without ball = call for pass</span>
          <span><kbd>F</kbd> tackle (5s cooldown)</span>
        </div>
      </header>

      <div class="hud">
        <div class="score">
          <div class="team team-a">YOU <span id="scoreA">0</span></div>
          <div class="time" id="time">1:00</div>
          <div class="team team-b"><span id="scoreB">0</span> CPU</div>
          <div class="mode-select" role="group" aria-label="Team size">
            <button class="mode-btn" data-mode="1" type="button">1v1</button>
            <button class="mode-btn" data-mode="2" type="button">2v2</button>
            <button class="mode-btn active" data-mode="3" type="button">3v3</button>
          </div>
        </div>
        <div class="bar">
          <div class="bar-label">Pass power</div>
          <div class="bar-track"><div class="bar-fill" id="powerBar"></div></div>
        </div>
      </div>

      <canvas id="pitch" width="1430" height="780" aria-label="Rugby pitch"></canvas>

      <div class="msg" id="msg"></div>
      <div class="roster" id="roster"></div>
    </main>

    <script type="module" src="./app.js?v=5"></script>
  </body>
</html>

# Render deploy config for the Chocoby rugby server.
# Push this repo, hit "New > Blueprint" on Render, point at this file, deploy.
services:
  - type: web
    name: chocoby-rugby
    env: node
    plan: free
    rootDir: rugby-server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
